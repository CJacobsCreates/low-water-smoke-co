<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@600;700&family=Libre+Franklin:wght@500;600&family=IBM+Plex+Mono:wght@500&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:2048px;height:2048px;background:#EFE6D6;}
body{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 25%,#F7F1E6 0,#EFE6D6 45%,#E3D6BF 100%)}
.card{width:1500px;height:945px;border-radius:56px;background:#9E3B26;position:relative;overflow:hidden;

.in{position:absolute;inset:70px 90px;display:flex;flex-direction:column;justify-content:space-between}
.brand{font:700 120px/0.9 'Zilla Slab';letter-spacing:2px}
.sub{font:600 34px 'Libre Franklin';letter-spacing:10px;margin-top:22px;opacity:.85}
.amt{font:700 210px/1 'Zilla Slab'}
.row{display:flex;justify-content:space-between;align-items:flex-end}
.mono{font:500 32px 'IBM Plex Mono';letter-spacing:4px;opacity:.85}
svg{position:absolute;right:-40px;bottom:-30px;width:900px;opacity:.22}
</style></head><body><div class="card">
